name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No npm install, no server run, no API calls — check.mjs is dependency-free.
      - name: Run verification
        run: node check.mjs
      - name: Syntax-check AI + server sources
        run: |
          node --check ai/config.js
          node --check ai/ai.js
          node --check server/index.mjs
