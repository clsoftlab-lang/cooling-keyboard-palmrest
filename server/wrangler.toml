#
# Cloudflare Workers config for the AI proxy (worker.js).
# Free tier = no server to babysit (무인).
#
# Deploy:
#   wrangler secret put ANTHROPIC_API_KEY   # sets the server-side key
#   wrangler deploy
#
# Optional overrides (set as vars or secrets): AI_MODEL, AI_EFFORT,
# AI_RATE_PER_MIN, AI_MONTHLY_TOKEN_CAP, AI_MAX_TOKENS.

name = "cooling-palmrest-ai-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cost-first default model; raise to claude-sonnet-5 / claude-opus-5 for quality.
[vars]
AI_MODEL = "claude-haiku-4-5"

# NOTE: ANTHROPIC_API_KEY is a SECRET, not a var — set it with:
#   wrangler secret put ANTHROPIC_API_KEY
# Never place the key in this file or the repo.
